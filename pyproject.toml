[project]
name = "sple-skills"
version = "0.1.3"
description = "Agent skills for embedded software product line engineering"
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "python scripts/sync_version.py"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["chore*", "ci*"]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.branches.develop]
match = "develop"

[tool.pytest.ini_options]
addopts = "-vv"
testpaths = ["test", "plugins/embedded-sple/skills"]
pythonpath = ["plugins/embedded-sple/skills/his-metrics/scripts"]
